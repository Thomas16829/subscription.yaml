proxy-groups:
  - name: 负载均衡
    type: load-balance
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - CF_V8_yg8
      - CF_V9_yg9
      - CF_V10_yg10
      - CF_V11_yg11
      - CF_V12_yg12
      - CF_V13_yg13

  - name: 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - CF_V8_yg8
      - CF_V9_yg9
      - CF_V10_yg10
      - CF_V11_yg11
      - CF_V12_yg12
      - CF_V13_yg13

  - name: 链式代理
    type: select
    proxies:
      - US-IP
      - DIRECT

  - name: 🌍选择代理
    type: select
    proxies:
      - 负载均衡
      - 自动选择
      - DIRECT
      - CF_V8_yg8
      - CF_V9_yg9
      - CF_V10_yg10
      - CF_V11_yg11
      - CF_V12_yg12
      - CF_V13_yg13

rules:
