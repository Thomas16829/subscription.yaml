# =====================
# 代理组
# =====================
proxy-groups:

  - name: 自动中转
    type: url-test
    proxies:
      - 香港01-HY2
      - 香港02-HY2
      - 香港A
      - 香港B
      - 香港C
      - 香港D
      - 美国A
      - 美国B
      - 美国C
      - 美国D
      - A-WS-中转
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50


  - name: 链式代理
    type: select
    proxies:
      - 住宅-洛杉矶
      - 自动中转
      - DIRECT


# =====================
# 分流规则
# =====================
