# =====================
# Clash Meta 真链式配置
# =====================

mixed-port: 7890

allow-lan: true

bind-address: "*"

mode: rule

log-level: info

tcp-concurrent: true

unified-delay: true

find-process-mode: strict

keep-alive-idle: 600

keep-alive-interval: 15


external-controller: 127.0.0.1:9090


profile:
  store-selected: true
  store-fake-ip: true



# =====================
# DNS
# =====================

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip

  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"
    - "time.windows.com"
    - "time.apple.com"
    - "time.android.com"
    - "*.ntp.org"

  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

  fallback:
    - https://1.0.0.1/dns-query
    - https://8.8.4.4/dns-query

  fallback-filter:
    geoip: true
    geoip-code: CN



# =====================
# 广告规则集
# =====================

rule-providers:


  reject:

    type: http

    behavior: domain

    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt

    path: ./ruleset/reject.yaml

    interval: 86400



  anti-ad:

    type: http

    behavior: domain

    url: https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/master/anti-ad-clash.yaml

    path: ./ruleset/anti-ad.yaml

    interval: 86400




